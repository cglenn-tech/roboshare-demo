              </div>
            </div>
          </div>
        </div>
      );

      const PaymentScreen = () => (
        <div className="min-h-screen bg-white p-6 flex items-center justify-center">
          <div className="max-w-md w-full">
            <div className="text-center mb-6">
              <h1 className="text-5xl font-bold text-black mb-2">Robo<span className="text-blue-600">Share</span></h1>
            </div>
            <div className="bg-white rounded-2xl shadow-xl border-2 border-black p-8">
              <h2 className="text-2xl font-semibold text-gray-800 mb-6">Payment Details</h2>
              <div className="bg-gray-100 rounded-lg p-4 mb-6">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-gray-700">Selected Robot</span>
                  <span className="font-semibold text-gray-900">{selectedRobot?.name}</span>
                </div>
                <div className="flex items-center justify-between mb-2">
                  <span className="text-gray-700">Hourly Rate</span>
                  <span className="font-semibold text-gray-900">${selectedRobot?.price}/hr</span>
                </div>
                <div className="border-t border-gray-300 mt-3 pt-3 flex items-center justify-between">
                  <span className="text-gray-900 font-medium">Estimated 2 Hours</span>
                  <span className="text-2xl font-bold text-black">${selectedRobot?.price * 2}</span>
                </div>
              </div>
              <div className="space-y-4 mb-6">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Card Number</label>
                  <input type="text" placeholder="1234 5678 9012 3456" className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-black focus:outline-none" />
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Expiry Date</label>
                    <input type="text" placeholder="MM/YY" className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-black focus:outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">CVV</label>
                    <input type="text" placeholder="123" className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-black focus:outline-none" />
                  </div>
                </div>
              </div>
              <button onClick={handlePayment} className="w-full bg-black hover:bg-gray-800 text-white font-semibold py-4 rounded-lg text-lg transition-colors">
                Continue to Access Info
              </button>
            </div>
          </div>
        </div>
      );

      const AccessScreen = () => (
        <div className="min-h-screen bg-white p-6 flex items-center justify-center">
          <div className="max-w-md w-full">
            <div className="text-center mb-6">
              <h1 className="text-5xl font-bold text-black mb-2">Robo<span className="text-blue-600">Share</span></h1>
            </div>
            <div className="bg-white rounded-2xl shadow-xl border-2 border-black p-8">
              <h2 className="text-2xl font-semibold text-gray-800 mb-4">Building Access Info</h2>
              <p className="text-sm text-gray-600 mb-6">Help your robot access your location smoothly</p>
              
              <div className="space-y-4 mb-6">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Building Code (Optional)</label>
                  <input 
                    type="text" 
                    value={buildingCode}
                    onChange={(e) => setBuildingCode(e.target.value)}
                    placeholder="e.g., #1234 or Building A" 
                    className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-black focus:outline-none" 
                  />
                </div>
                
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Access Notes (Optional)</label>
                  <textarea 
                    value={accessNotes}
                    onChange={(e) => setAccessNotes(e.target.value)}
                    placeholder="e.g., 'Use side entrance', 'Call on arrival', 'Floor 3, Room 301'"
                    className="w-full h-32 p-3 border-2 border-gray-200 rounded-lg focus:border-black focus:outline-none resize-none"
                  />
                </div>
              </div>

              <div className="bg-blue-50 border-2 border-blue-200 rounded-lg p-4 mb-6">
                <p className="text-sm text-gray-700">
                  💡 <strong>Tip:</strong> Include any special instructions to help the robot navigate to your location efficiently.
                </p>
              </div>

              <div className="space-y-3">
                <button 
                  onClick={handleAccessSubmit} 
                  className="w-full bg-black hover:bg-gray-800 text-white font-semibold py-4 rounded-lg text-lg transition-colors"
                >
                  Deploy Robot
                </button>
                <button 
                  onClick={handleAccessSubmit} 
                  className="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-3 rounded-lg transition-colors"
                >
                  Skip - No special access needed
                </button>
              </div>
            </div>
          </div>
        </div>
      );

      const LiveFeedScreen = () => (
        <div className="min-h-screen bg-white p-6">
          <div className="max-w-5xl mx-auto">
            <div className="text-center mb-8">
              <h1 className="text-5xl font-bold text-black mb-2">Robo<span className="text-blue-600">Share</span></h1>
              <p className="text-lg text-gray-700">Your robot is on the way!</p>
            </div>
            
            <div className="grid lg:grid-cols-2 gap-6 mb-6">
              {/* Robot Card */}
              <div className="bg-white rounded-2xl shadow-lg border-2 border-gray-200 overflow-hidden">
                <div className="bg-gradient-to-br from-gray-50 to-gray-100 p-8 flex items-center justify-center">
                  <img src={selectedRobot?.image} alt={selectedRobot?.name} className="w-48 h-48 object-contain" />
                </div>
                <div className="p-6">
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <h2 className="text-2xl font-bold text-black">{selectedRobot?.name}</h2>
                      <p className="text-sm text-gray-500">{selectedRobot?.model}</p>
                    </div>
                    <div className="text-right">
                      <div className="text-3xl font-bold text-black">${selectedRobot?.price}</div>
                      <p className="text-sm text-gray-500">/hour</p>
                    </div>
                  </div>
                  
                  <div className="grid grid-cols-2 gap-3 mb-4">
                    <div className="bg-gray-50 rounded-lg p-3 border border-gray-200">
                      <p className="text-xs text-gray-500 mb-1">Battery</p>
                      <div className="flex items-center">
                        <div className="text-lg font-bold text-black">87%</div>
                        <span className="ml-2">🔋</span>
                      </div>
                    </div>
                    <div className="bg-gray-50 rounded-lg p-3 border border-gray-200">
                      <p className="text-xs text-gray-500 mb-1">Distance</p>
                      <div className="flex items-center">
                        <div className="text-lg font-bold text-black">2.3 mi</div>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between py-3 border-t border-gray-200">
                    <span className="text-sm text-gray-600">Status</span>
                    <div className="flex items-center">
                      <div className="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></div>
                      <span className="text-sm font-semibold text-green-700">En Route</span>
                    </div>
                  </div>

                  <div className="flex items-center justify-between py-3 border-t border-gray-200">
                    <span className="text-sm text-gray-600">Task</span>
                    <span className="text-sm font-semibold text-black">{taskDescription}</span>
                  </div>
                </div>
              </div>

              {/* ETA & Live Feed Card */}
              <div className="space-y-6">
                <div className="bg-white rounded-2xl shadow-lg border-2 border-gray-200 p-6">
                  <div className="flex items-center justify-between mb-6">
                    <h3 className="text-xl font-bold text-black">Estimated Arrival</h3>
                    <div className="flex items-center bg-red-50 border border-red-200 rounded-full px-3 py-1">
                      <div className="w-2 h-2 bg-red-500 rounded-full mr-2 animate-pulse"></div>
                      <span className="text-xs font-semibold text-red-700 uppercase">Live</span>
                    </div>
                  </div>
                  
                  <div className="text-center py-8 bg-gradient-to-br from-blue-50 to-gray-50 rounded-xl mb-4">
                    <div className="text-6xl font-bold text-black mb-2">
                      {Math.floor(eta / 60)}:{(eta % 60).toString().padStart(2, '0')}
                    </div>
                    <div className="text-lg text-gray-600">minutes</div>
                  </div>

                  {eta === 0 && (
                    <div className="bg-green-50 border-2 border-green-200 rounded-xl p-4 text-center">
                      <div className="text-3xl mb-2">🎉</div>
                      <div className="font-bold text-green-700">Robot has arrived!</div>
                    </div>
                  )}
                </div>

                {/* Camera Feed */}
                <div className="bg-white rounded-2xl shadow-lg border-2 border-gray-200 overflow-hidden">
                  <div className="bg-gray-100 aspect-video relative">
                    <div className="absolute inset-0 flex items-center justify-center text-center p-6">
                      <div>
                        <div className="text-5xl mb-3">📹</div>
                        <p className="text-gray-700 font-medium">Live Camera Feed</p>
                        <p className="text-sm text-gray-500 mt-1">Robot location: {eta > 0 ? 'En route' : 'Arrived'}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Access Info & Actions */}
            <div className="grid lg:grid-cols-2 gap-6">
              {(buildingCode || accessNotes) && (
                <div className="bg-blue-50 rounded-2xl border-2 border-blue-200 p-6">
                  <h3 className="text-lg font-bold text-black mb-4">Access Information</h3>
                  {buildingCode && (
                    <div className="mb-3">
                      <p className="text-xs text-gray-600 mb-1">Building Code</p>
                      <p className="text-sm font-semibold text-black">{buildingCode}</p>
                    </div>
                  )}
                  {accessNotes && (
                    <div>
                      <p className="text-xs text-gray-600 mb-1">Access Notes</p>
                      <p className="text-sm text-black">{accessNotes}</p>
                    </div>
                  )}
                </div>
              )}
              
              <div className="bg-white rounded-2xl shadow-lg border-2 border-gray-200 p-6">
                <h3 className="text-lg font-bold text-black mb-4">Quick Actions</h3>
                <div className="space-y-3">
                  <button className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors">
                    📍 View Location
                  </button>
                  <button className="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 rounded-lg transition-colors border border-gray-300">
                    💬 Contact Support
                  </button>
                  <button className="w-full bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-3 rounded-lg transition-colors border border-red-200">
                    ❌ Cancel Service
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div>
          {step === 'task' && <TaskScreen />}
          {step === 'selection' && <SelectionScreen />}
          {step === 'payment' && <PaymentScreen />}
          {step === 'access' && <AccessScreen />}
          {step === 'live' && <LiveFeedScreen />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RoboShareApp />);
  </script>
</body>
</html>
